<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Made By Yellow</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;900&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
body {
  min-height: 100vh;
  background: #f7f5f0;
  background-image:
    linear-gradient(rgba(0,0,0,0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.06) 1px, transparent 1px);
  background-size: 32px 32px;
  padding: 40px 48px 48px;
  font-family: 'Poppins', sans-serif;
  max-width: 900px;
  margin: 0 auto;
}
.top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:40px; }
.brand-name { font-size:13px; font-weight:700; color:#1a1a1a; letter-spacing:0.05em; }
.brand-sub { font-size:11px; color:#999; margin-top:2px; }
.dot { width:48px; height:48px; border-radius:50%; background:#FEBC06; box-shadow:0 0 0 8px rgba(254,188,6,0.15); flex-shrink:0; }
.type-block { display:flex; align-items:center; gap:20px; margin-bottom:2px; }
.type-block.right { justify-content:flex-end; }
.big-word {
  font-size: clamp(64px, 14vw, 100px);
  font-weight:900; color:#1a1a1a; line-height:0.95;
  letter-spacing:-2px; text-decoration:none;
  transition:color 0.15s; flex-shrink:0;
}
.big-word:hover { color:#FEBC06; }
.pill {
  display:inline-block; background:#FEBC06; color:#000;
  font-size:11px; font-weight:700; padding:6px 16px;
  border-radius:100px; letter-spacing:0.04em;
  white-space:nowrap; flex-shrink:0;
  text-decoration:none; transition:opacity 0.15s;
}
.pill:hover { opacity:0.85; }
.bottom {
  margin-top:40px; border-top:1px solid #ddd; padding-top:20px;
  display:flex; justify-content:space-between; align-items:flex-end;
}
.bottom-text { font-size:13px; color:#888; line-height:1.6; }
.bottom-text strong { color:#1a1a1a; font-weight:700; }
.radhe { font-size:13px; color:#1a1a1a; font-weight:400; }
</style>
</head>
<body>
  <div class="top">
    <div>
      <div class="brand-name">MADE BY YELLOW</div>
      <div class="brand-sub">Powered by The Yellowverse</div>
    </div>
    <div class="dot"></div>
  </div>
  <!-- 2026-08-26 — Client + Studio portals hidden per Suriti's simplification.
       Client comms move to WhatsApp; designer uploads move inline into Team.
       The files still exist at /client.html and /studio.html for now, so anyone
       with the URL bookmarked can still get in during the transition. -->
  <div class="type-block">
    <a href="/team.html" class="big-word">Team.</a>
    <a href="/team.html" class="pill">Daily Workspace →</a>
  </div>
  <div class="type-block right">
    <a href="/founder.html" class="pill">← CEO Dashboard</a>
    <a href="/founder.html" class="big-word">Founder.</a>
  </div>
  <div class="bottom">
    <div class="bottom-text">
      Your work. Your team.<br>
      <strong>Everything in one place.</strong>
    </div>
    <div class="radhe">🪷 Radhe Shyam</div>
  </div>
</body>
</html>
